<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление подписками</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --primary-green: #21A038;
            --dark-green: #107F27;
            --near-black: #1A1A1A;
            --bg-card: #F3F4F6;

            --flag-red: #E64646;
            --flag-yellow: #FF8C00;
            --flag-green: #2FA84F;
        }

        body {
            background-color: #FFFFFF;
            color: var(--near-black);
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .dot-red {
            background-color: var(--flag-red);
        }

        .dot-yellow {
            background-color: var(--flag-yellow);
        }

        .dot-green {
            background-color: var(--flag-green);
        }

        .bg-primary-custom {
            background-color: var(--primary-green);
        }

        .bg-card-custom {
            background-color: var(--bg-card);
        }

        .text-main-custom {
            color: var(--near-black);
        }

        .border-warning {
            border-color: var(--flag-yellow);
        }

        .text-warning {
            color: var(--flag-yellow);
        }
    </style>
</head>

<body class="p-4 pb-12">

    <!-- ================= ЭКРАН 1: ГЛАВНАЯ ================= -->
    <div id="screen-main" class="block">
        <!-- Шапка -->
        <div class="bg-primary-custom text-white rounded-xl p-5 mb-6 shadow-sm" onclick="triggerHaptic()">
            <div class="text-[11px] font-bold uppercase tracking-wider mb-2 opacity-90">
                Расход на подписки
            </div>

            <div class="flex items-center gap-3 mb-4">
                <div class="text-[28px] font-extrabold leading-none" id="monthly-total-value">
                    0 ₽<span class="text-[16px] font-medium text-white/90">/мес</span>
                </div>
                <div class="bg-white/20 text-[11px] font-medium px-2 py-1 rounded-md" id="yearly-savings">
                    Экономия 0 ₽/год
                </div>
            </div>
        </div>

        <!-- Список подписок (ФИЛЬТРЫ УДАЛЕНЫ) -->
        <div class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-3 px-1" id="subs-header">
            Активные подписки (0)
        </div>

        <div id="subscriptions-list" class="space-y-3 mb-6"></div>

        <!-- Блок пересечений (КЛИКАБЕЛЬНЫЙ) -->
        <div id="overlaps-container" class="hidden">
            <div onclick="showOverlapsScreen()"
                class="border border-warning rounded-2xl p-4 flex items-center justify-between bg-white shadow-sm active:bg-gray-50 transition-colors cursor-pointer">
                <div class="flex gap-3 items-start">
                    <div
                        class="w-6 h-6 flex items-center justify-center border-2 border-warning rounded-md text-warning font-bold text-[14px] flex-shrink-0">
                        !</div>
                    <div>
                        <div class="text-[14px] font-bold text-main-custom mb-0.5" id="overlap-title-main">Найдено
                            пересечений: 0</div>
                        <div class="text-[11px] text-gray-500 font-medium">Вы переплачиваете за дублирующий функционал
                        </div>
                    </div>
                </div>
                <div class="text-gray-400">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= ЭКРАН 2: ПЕРЕСЕЧЕНИЯ ================= -->
    <div id="screen-overlaps" class="hidden">
        <!-- Шапка пересечений -->
        <div class="bg-primary-custom text-white rounded-xl p-5 mb-6 shadow-sm">
            <div class="text-[11px] font-bold uppercase tracking-wider mb-2 opacity-90">
                Переплата за дубли
            </div>
            <div class="text-[28px] font-extrabold leading-none mb-2" id="overlap-total-savings">
                0 ₽/год
            </div>
            <div class="bg-white/20 text-[12px] font-medium px-3 py-1.5 rounded-lg inline-block"
                id="overlap-explanation-badge">
                Три видеосервиса закрывают одну потребность
            </div>
        </div>

        <div class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-3 px-1">
            Дублирующие сервисы
        </div>

        <div id="overlap-services-list" class="space-y-3 mb-6"></div>

        <!-- Рекомендация -->
        <div class="bg-[#F0FDF4] border border-[#86EFAC] p-4 rounded-xl mb-6 flex gap-3 items-start">
            <div class="text-[#16A34A] mt-0.5">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 16v-4" />
                    <path d="M12 8h.01" />
                </svg>
            </div>
            <div>
                <h4 class="font-bold text-[14px] text-gray-900 mb-1">Рекомендация</h4>
                <p class="text-[12px] text-gray-600 leading-relaxed" id="overlap-recommendation-text"></p>
            </div>
        </div>

        <button onclick="triggerHaptic()"
            class="w-full bg-primary-custom text-white font-bold text-[16px] py-4 rounded-xl mb-4 active:bg-dark-green transition-colors">
            Оптимизировать
        </button>

        <button onclick="goBack()"
            class="w-full text-gray-500 font-medium text-[14px] py-2 active:text-gray-800 transition-colors">
            Оставить всё как есть
        </button>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // ================= НАСТРОЙКИ СЕТИ =================
        const BACKEND_URL = new URLSearchParams(location.search).get('api') || location.origin;
        let globalData = null;

        // План Б: 11 подписок из mock_analyze_response.json
        const mockData = {
            "summary": { "monthly_total": 8066.17, "potential_savings_yearly": 10776 },
            "subscriptions": [
                { "name": "Кинопоиск", "amount": 399, "period": "monthly", "flag": "red", "reason": "Один из трёх видеосервисов на счёте" },
                { "name": "Okko", "amount": 499, "period": "monthly", "flag": "red", "reason": "Дублирует Кинопоиск и Wink" },
                { "name": "Яндекс Плюс", "amount": 449, "period": "monthly", "flag": "yellow", "reason": "Включает музыку и доставку — выгоднее оставить" },
                { "name": "СберПрайм", "amount": 299, "period": "monthly", "flag": "green", "reason": "Даёт кэшбэк и бесплатную доставку, окупается" },
                { "name": "ChatGPT", "amount": 1990, "period": "monthly", "flag": "yellow", "reason": "Используется для работы, высокая стоимость" },
                { "name": "Apple Services", "amount": 599, "period": "monthly", "flag": "green", "reason": "Семейный тариф iCloud" },
                { "name": "World Class", "amount": 3500, "period": "monthly", "flag": "yellow", "reason": "Крупный регулярный платеж" },
                { "name": "Duolingo", "amount": 331, "period": "monthly", "flag": "green", "reason": "Активное ежедневное обучение" },
                { "name": "Wink", "amount": 299, "period": "monthly", "flag": "red", "reason": "Дублирует Кинопоиск и Okko" },
                { "name": "Литрес", "amount": 399, "period": "monthly", "flag": "green", "reason": "Регулярное чтение книг" },
                { "name": "МТС Premium", "amount": 249, "period": "monthly", "flag": "yellow", "reason": "Дублирует экосистему Яндекса и Сбера" }
            ],
            "overlaps": [
                {
                    "explanation": "У вас три видеосервиса: Кинопоиск, Okko и Wink.",
                    "savings_yearly": 10776,
                    "recommendation": "Отключение двух дублей сократит расходы без потери контента.",
                    "services": ["Кинопоиск", "Okko", "Wink"]
                }
            ]
        };

        function triggerHaptic() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        }

        function getAvatarColor(name) {
            if (name.includes('Кино')) return 'bg-[#FFD940] text-gray-900';
            if (name.includes('Okko')) return 'bg-[#5021A0] text-white';
            if (name.includes('Яндекс')) return 'bg-[#E64646] text-white';
            if (name.includes('Сбер')) return 'bg-[#2FA84F] text-white';
            if (name.includes('Wink')) return 'bg-[#0099FF] text-white';
            return 'bg-blue-500 text-white';
        }

        function formatMoney(num) {
            return Number(Math.round(num)).toLocaleString('ru-RU');
        }

        function showOverlapsScreen() {
            triggerHaptic();
            document.getElementById('screen-main').classList.add('hidden');
            document.getElementById('screen-overlaps').classList.remove('hidden');

            if (window.Telegram && window.Telegram.WebApp.BackButton) {
                window.Telegram.WebApp.BackButton.show();
                window.Telegram.WebApp.BackButton.onClick(goBack);
            }
        }

        function goBack() {
            triggerHaptic();
            document.getElementById('screen-overlaps').classList.add('hidden');
            document.getElementById('screen-main').classList.remove('hidden');

            if (window.Telegram && window.Telegram.WebApp.BackButton) {
                window.Telegram.WebApp.BackButton.hide();
                window.Telegram.WebApp.BackButton.offClick(goBack);
            }
        }

        // ================= РЕНДЕР =================
        function renderSubscriptions() {
            const subsContainer = document.getElementById('subscriptions-list');
            subsContainer.innerHTML = '';

            const subs = globalData.subscriptions || [];
            document.getElementById('subs-header').innerText = `Активные подписки (${subs.length})`;

            subs.forEach(sub => {
                let dotClass = sub.flag === 'red' ? 'dot-red' : (sub.flag === 'yellow' ? 'dot-yellow' : 'dot-green');
                const initial = sub.name.charAt(0).toUpperCase();
                const avatarStyles = getAvatarColor(sub.name);
                const periodSuffix = sub.period === 'yearly' ? '₽/год' : '₽/мес';

                const cardHTML = `
                    <div class="bg-card-custom p-4 rounded-[16px] shadow-sm active:bg-gray-200 transition-colors" onclick="triggerHaptic()">
                        <div class="flex justify-between items-center mb-2.5">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full ${avatarStyles} flex items-center justify-center font-bold text-[16px]">
                                    ${initial}
                                </div>
                                <h3 class="font-bold text-[16px] text-main-custom">${sub.name}</h3>
                            </div>
                            <span class="text-[16px] font-bold text-main-custom">${formatMoney(sub.amount)} ${periodSuffix}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="w-[6px] h-[6px] rounded-full flex-shrink-0 ${dotClass}"></span>
                            <span class="text-[11px] text-gray-500 font-medium leading-tight">${sub.reason}</span>
                        </div>
                    </div>
                `;
                subsContainer.innerHTML += cardHTML;
            });
        }

        function renderApp(data) {
            globalData = data;

            document.getElementById('monthly-total-value').innerHTML = `${formatMoney(data.summary.monthly_total)} ₽<span class="text-[16px] font-medium text-white/90">/мес</span>`;
            document.getElementById('yearly-savings').innerText = `Экономия ${formatMoney(data.summary.potential_savings_yearly)} ₽/год`;

            const overlapGroups = data.overlaps ? data.overlaps.length : 0;
            if (overlapGroups > 0) {
                document.getElementById('overlaps-container').classList.remove('hidden');
                document.getElementById('overlap-title-main').innerText = `Найдено пересечений: ${overlapGroups}`;

                const overlap = data.overlaps[0];
                document.getElementById('overlap-total-savings').innerText = `${formatMoney(overlap.savings_yearly)} ₽/год`;
                document.getElementById('overlap-explanation-badge').innerText = overlap.explanation;
                document.getElementById('overlap-recommendation-text').innerText = overlap.recommendation || "Отключите дублирующие сервисы для экономии.";

                const overlapSubsContainer = document.getElementById('overlap-services-list');
                overlapSubsContainer.innerHTML = '';

                const dupes = (overlap.services || []).map(name => data.subscriptions.find(s => s.name === name)).filter(Boolean);

                dupes.forEach(sub => {
                    const initial = sub.name.charAt(0).toUpperCase();
                    const avatarStyles = getAvatarColor(sub.name);
                    const periodSuffix = sub.period === 'yearly' ? '₽/год' : '₽/мес';

                    overlapSubsContainer.innerHTML += `
                        <div class="bg-card-custom p-4 rounded-[16px]">
                            <div class="flex justify-between items-center mb-2.5">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full ${avatarStyles} flex items-center justify-center font-bold text-[16px]">${initial}</div>
                                    <h3 class="font-bold text-[16px] text-main-custom">${sub.name}</h3>
                                </div>
                                <span class="text-[16px] font-bold text-main-custom">${formatMoney(sub.amount)} ${periodSuffix}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="w-[6px] h-[6px] rounded-full flex-shrink-0 dot-red"></span>
                                <span class="text-[11px] text-gray-500 font-medium leading-tight">${sub.reason}</span>
                            </div>
                        </div>
                    `;
                });
            }

            renderSubscriptions();
        }

        async function loadRealData() {
            try {
                const response = await fetch(BACKEND_URL + '/analyze/demo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) throw new Error('Ошибка сети');
                const realData = await response.json();
                renderApp(realData);
            } catch (error) {
                console.error("Бэкенд недоступен, загружаем мок:", error);
                renderApp(mockData);
            }
        }

        loadRealData();
    </script>
</body>

</html>
