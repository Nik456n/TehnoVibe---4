<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление подписками</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --primary-green: #21A038;
            --dark-green: #107F27;
            --near-black: #1A1A1A;
            --bg-card: #F3F4F6;

            --flag-red: #E64646;
            --flag-yellow: #FF8C00;
            --flag-green: #2FA84F;
            --blue-interactive: #0A84FF;
        }

        body {
            background-color: #FFFFFF;
            color: var(--near-black);
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .dot-red {
            background-color: var(--flag-red);
        }

        .dot-yellow {
            background-color: var(--flag-yellow);
        }

        .dot-green {
            background-color: var(--flag-green);
        }

        .bg-primary-custom {
            background-color: var(--primary-green);
        }

        .bg-card-custom {
            background-color: var(--bg-card);
        }

        .text-main-custom {
            color: var(--near-black);
        }

        .border-warning {
            border-color: var(--flag-yellow);
        }

        .text-warning {
            color: var(--flag-yellow);
        }
    </style>
</head>

<body class="p-4 pb-12">

    <!-- ================= ШАПКА ================= -->
    <div class="bg-primary-custom text-white rounded-xl p-5 mb-5 shadow-sm" onclick="triggerHaptic()">
        <div class="text-[11px] font-bold uppercase tracking-wider mb-2 opacity-90">
            Расход на подписки
        </div>

        <div class="flex items-center gap-3 mb-4">
            <div class="text-[28px] font-extrabold leading-none" id="monthly-total-value">
                0 ₽<span class="text-[16px] font-medium text-white/90">/мес</span>
            </div>
            <div class="bg-white/20 text-[11px] font-medium px-2 py-1 rounded-md" id="yearly-savings">
                Экономия 0 ₽/год
            </div>
        </div>

        <div class="bg-black/10 rounded-lg p-2.5 flex items-center gap-2 hidden" id="header-alert">
            <span class="w-[8px] h-[8px] rounded-full dot-yellow flex-shrink-0"></span>
            <span class="text-[11px] font-medium" id="header-alert-text">Анализируем подписки...</span>
        </div>
    </div>

    <!-- ================= ФИЛЬТРЫ ================= -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar mb-6">
        <button class="bg-primary-custom text-white px-4 py-1.5 rounded-full text-[14px] font-medium whitespace-nowrap"
            onclick="triggerHaptic()">Все</button>
        <button
            class="bg-card-custom text-main-custom px-4 py-1.5 rounded-full text-[14px] font-medium whitespace-nowrap"
            onclick="triggerHaptic()">Кино</button>
        <button
            class="bg-card-custom text-main-custom px-4 py-1.5 rounded-full text-[14px] font-medium whitespace-nowrap"
            onclick="triggerHaptic()">Музыка</button>
        <button
            class="bg-card-custom text-main-custom px-4 py-1.5 rounded-full text-[14px] font-medium whitespace-nowrap"
            onclick="triggerHaptic()">Облако</button>
    </div>

    <!-- ================= СПИСОК ПОДПИСОК ================= -->
    <div class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-3 px-1" id="subs-header">
        Активные подписки (0)
    </div>

    <div id="subscriptions-list" class="space-y-3 mb-6"></div>

    <!-- ================= БЛОК ПЕРЕСЕЧЕНИЙ ================= -->
    <div id="overlaps-container" class="hidden">
        <div class="border border-warning rounded-2xl p-4 flex items-center justify-between bg-white shadow-sm active:bg-gray-50 transition-colors"
            onclick="triggerHaptic()">
            <div class="flex gap-3 items-start">
                <div
                    class="w-6 h-6 flex items-center justify-center border-2 border-warning rounded-md text-warning font-bold text-[14px] flex-shrink-0">
                    !</div>
                <div>
                    <div class="text-[14px] font-bold text-main-custom mb-0.5" id="overlap-title">Найдено пересечений: 0
                    </div>
                    <div class="text-[11px] text-gray-500 font-medium">Вы переплачиваете за дублирующий функционал</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        function triggerHaptic() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        }

        // ПРАВКА 5: Адрес бэкенда вынесен наверх
        const BACKEND_URL = 'http://127.0.0.1:8000/analyze/demo';

        // ПРАВКА 2: Полный мок-файл возвращен как запасной план
        const mockData = {
            "summary": { "monthly_total": 8066, "potential_savings_yearly": 11964 },
            "subscriptions": [
                { "name": "Кинопоиск", "amount": 399, "period": "1 раз в месяц", "flag": "red", "reason": "Один из трёх видеосервисов на счёте" },
                { "name": "Okko", "amount": 499, "period": "1 раз в месяц", "flag": "red", "reason": "Дублирует Кинопоиск и Wink" },
                { "name": "Яндекс Плюс", "amount": 449, "period": "1 раз в месяц", "flag": "yellow", "reason": "Включает музыку и доставку — выгоднее оставить" },
                { "name": "СберПрайм", "amount": 299, "period": "1 раз в месяц", "flag": "green", "reason": "Даёт кэшбэк и бесплатную доставку, окупается" },
                { "name": "ChatGPT", "amount": 1990, "period": "1 раз в месяц", "flag": "yellow", "reason": "Используется для работы, высокая стоимость" },
                { "name": "Apple Services", "amount": 599, "period": "1 раз в месяц", "flag": "green", "reason": "Семейный тариф iCloud" },
                { "name": "World Class", "amount": 3500, "period": "1 раз в месяц", "flag": "yellow", "reason": "Крупный регулярный платеж" },
                { "name": "Duolingo", "amount": 331, "period": "1 раз в месяц", "flag": "green", "reason": "Активное ежедневное обучение" },
                { "name": "Wink", "amount": 299, "period": "1 раз в месяц", "flag": "red", "reason": "Дублирует Кинопоиск и Okko" },
                { "name": "Литрес", "amount": 399, "period": "1 раз в месяц", "flag": "green", "reason": "Регулярное чтение книг" },
                { "name": "МТС Premium", "amount": 249, "period": "1 раз в месяц", "flag": "yellow", "reason": "Дублирует экосистему Яндекса и Сбера" }
            ],
            "overlaps": [
                { "explanation": "У вас три видеосервиса...", "savings_yearly": 10776 }
            ]
        };

        function getAvatarColor(name) {
            if (name.includes('Кино')) return 'bg-[#FFD940] text-gray-900';
            if (name.includes('Okko')) return 'bg-[#5021A0] text-white';
            if (name.includes('Яндекс')) return 'bg-[#E64646] text-white';
            if (name.includes('Сбер')) return 'bg-[#2FA84F] text-white';
            return 'bg-blue-500 text-white';
        }

        function formatMoney(num) {
            return Number(num).toLocaleString('ru-RU');
        }

        function renderApp(data) {
            document.getElementById('monthly-total-value').innerHTML = `${formatMoney(data.summary.monthly_total)} ₽<span class="text-[16px] font-medium text-white/90">/мес</span>`;
            document.getElementById('yearly-savings').innerText = `Экономия ${formatMoney(data.summary.potential_savings_yearly)} ₽/год`;

            // ПРАВКА 3: Длина массива подписок считается динамически
            const totalSubs = data.subscriptions ? data.subscriptions.length : 0;
            document.getElementById('subs-header').innerText = `Активные подписки (${totalSubs})`;

            // ПРАВКА 4: Берем длину массива overlaps, так как groups_count нет в контракте
            const overlapGroups = data.overlaps ? data.overlaps.length : 0;

            if (overlapGroups > 0) {
                const alertBox = document.getElementById('header-alert');
                alertBox.classList.remove('hidden');
                document.getElementById('header-alert-text').innerText = `Найдено ${overlapGroups} группы пересекающихся подписок`;

                document.getElementById('overlaps-container').classList.remove('hidden');
                document.getElementById('overlap-title').innerText = `Найдено пересечений: ${overlapGroups}`;
            }

            const subsContainer = document.getElementById('subscriptions-list');
            subsContainer.innerHTML = '';

            (data.subscriptions || []).forEach(sub => {
                let dotClass = 'dot-green';
                if (sub.flag === 'red') dotClass = 'dot-red';
                else if (sub.flag === 'yellow') dotClass = 'dot-yellow';

                const initial = sub.name.charAt(0).toUpperCase();
                const avatarStyles = getAvatarColor(sub.name);

                const cardHTML = `
                    <div class="bg-card-custom p-4 rounded-[16px] shadow-sm active:bg-gray-200 transition-colors" onclick="triggerHaptic()">
                        <div class="flex justify-between items-center mb-2.5">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full ${avatarStyles} flex items-center justify-center font-bold text-[16px]">
                                    ${initial}
                                </div>
                                <h3 class="font-bold text-[16px] text-main-custom">${sub.name}</h3>
                            </div>
                            <span class="text-[16px] font-bold text-main-custom">${formatMoney(sub.amount)} ₽</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="w-[6px] h-[6px] rounded-full flex-shrink-0 ${dotClass}"></span>
                            <span class="text-[11px] text-gray-500 font-medium leading-tight">${sub.reason}</span>
                        </div>
                    </div>
                `;
                subsContainer.innerHTML += cardHTML;
            });
        }

        // Асинхронная загрузка с бэкенда с запасным планом
        async function loadRealData() {
            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) throw new Error('Ошибка сети при запросе к бэкенду');

                const realData = await response.json();
                renderApp(realData);
            } catch (error) {
                console.error("Бэкенд недоступен, загружаем План Б (мок-данные):", error);
                // ПРАВКА 2: Отрисовка фолбэка, если API упал
                renderApp(mockData);
            }
        }

        // ПРАВКА 1: Удален ошибочный renderApp(mockData) и вызывается только fetch
        loadRealData();
    </script>
</body>

</html>
